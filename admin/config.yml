backend:
  name: github
  repo: svetlana18011991/shkatulka-math
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "catalog"
    label: "Каталог материалов"
    files:
      - label: "База товаров"
        name: "products"
        file: "products.json"
        fields:
          - label: "Список материалов"
            name: "items"
            widget: "list"
            collapsed: true
            summary: '{{fields.title}}'
            fields:
              - { label: "Название", name: "title", widget: "string" }
              - { label: "Категория / Класс", name: "grade", widget: "select", multiple: true, options: ["5", "6", "7", "8", "9", "10", "11", "oge", "ege", "free"] }
              - { label: "Цена (0 если бесплатно)", name: "price", widget: "number", value_type: "int" }
              - { label: "Описание карточки (краткое)", name: "description", widget: "text", required: false }
              - { label: "Что внутри (список для модалки)", name: "inside", widget: "list", required: false }
              - { label: "Ссылка на оплату", name: "buyLink", widget: "string", required: false }
              - { label: "Главное фото", name: "image", widget: "image", required: false }
              - { label: "Галерея (доп. фото)", name: "gallery", widget: "list", field: { label: "Файл", name: "media", widget: "image" }, required: false }
              - { label: "Файл для скачивания", name: "downloadFile", widget: "file", required: false }
              - { label: "Теги", name: "tags", widget: "list", required: false }

  - name: "methodical"
    label: "Методическая копилка"
    media_folder: "downloads"
    public_folder: "downloads"
    files:
      - label: "Материалы копилки"
        name: "materials"
        file: "methodical-materials.json"
        fields:
          - label: "Публикации"
            name: "items"
            widget: "list"
            collapsed: true
            summary: '{{fields.title}}'
            fields:
              - { label: "ID латиницей (без пробелов)", name: "id", widget: "string", hint: "Например oge-algebra-variant-2. Должен быть уникальным." }
              - { label: "Название", name: "title", widget: "string" }
              - { label: "Раздел", name: "category", widget: "select", options: [{ label: "Пятиминутки ОГЭ", value: "pyatiminutki" }, { label: "Тренировочные варианты ОГЭ", value: "varianty" }] }
              - { label: "Описание", name: "description", widget: "text" }
              - { label: "Что входит в архив", name: "composition", widget: "list", field: {label: "Файл / формат", name: "entry", widget: "string"}, required: false }
              - { label: "Архив для скачивания", name: "downloadFile", widget: "file" }
              - { label: "Формат архива", name: "format", widget: "select", options: ["ZIP", "RAR", "7Z"], default: "ZIP" }
              - { label: "Дата публикации", name: "publishDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false }
              - { label: "Отдельная страница (если есть)", name: "pageUrl", widget: "string", required: false, hint: "Можно оставить пустым: подробности будут на автоматической странице." }
