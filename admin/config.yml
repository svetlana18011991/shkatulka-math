backend:
  name: github
  repo: svetlana18011991/shkatulka-math
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "catalog"
    label: "Каталог материалов"
    files:
      - label: "База товаров"
        name: "products"
        file: "products.json"
        fields:
          - label: "Список материалов"
            name: "items"
            widget: "list"
            fields:
              - { label: "Название", name: "title", widget: "string" }
              - { label: "Категория / Класс", name: "grade", widget: "select", options: ["5", "6", "7", "8", "9", "10", "11", "oge", "ege"] }
              - { label: "Цена (0 если бесплатно)", name: "price", widget: "number", value_type: "int" }
              - { label: "Краткое описание (для карточки)", name: "cardDescription", widget: "text", required: false }
              - { label: "Полное описание (для окна)", name: "description", widget: "text", required: false }
              - { label: "Что внутри (пункты)", name: "inside", widget: "list", required: false }
              - { label: "Ссылка на оплату", name: "buyLink", widget: "string", required: false }
              - { label: "Главное фото", name: "image", widget: "image" }
              - { label: "Галерея", name: "gallery", widget: "list", field: { label: "Фото", name: "photo", widget: "image" }, required: false }
              - { label: "Файл для скачивания", name: "downloadFile", widget: "file", required: false }
              - { label: "Теги", name: "tags", widget: "list", required: false }