<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Шкатулка математических интерактивов — Светлана Быкова</title>
<link href="style.css?v=no-black-corners-final" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&amp;family=Raleway:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
<style>
  .card-img img, #finalProductModal .fpm-img { object-fit: contain !important; transform: scale(1) !important; clip-path: none !important; padding: 10px !important; }
  .product-card:hover .card-img img { transform: scale(1.04) !important; }
  .card-desc, .fpm-desc { white-space: pre-line !important; }
  .fpm-inside h3, .product-modal-inside h3 { display: none !important; }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner container">
    <div class="logo">
      <div class="logo-icon-wrap">
        <svg fill="none" height="36" viewbox="0 0 36 36" width="36" xmlns="http://www.w3.org/2000/svg">
          <rect fill="#8B2635" height="18" rx="4" width="28" x="4" y="14"></rect>
          <rect fill="#A93226" height="18" rx="3" width="22" x="7" y="14"></rect>
          <path d="M4 18C4 15.8 5.8 14 8 14H28C30.2 14 32 15.8 32 18V20H4V18Z" fill="#C0392B"></path>
          <rect fill="#E8B84B" height="18" rx="2" width="6" x="15" y="14"></rect>
          <rect fill="#E8B84B" height="6" rx="2" width="8" x="14" y="10"></rect>
          <path d="M18 4C18 4 12 8 14 12C15 14 21 14 22 12C24 8 18 4 18 4Z" fill="#F0C040"></path>
          <circle cx="18" cy="10" fill="#8B2635" r="2"></circle>
        </svg>
      </div>
      <div class="logo-text">
        <span class="logo-title">Шкатулка</span>
        <span class="logo-sub">математических интерактивов</span>
      </div>
    </div>
    <nav class="nav">
      <a href="#products">Каталог</a>
      <a href="#free">Бесплатные</a>
      <a href="#about">Обо мне</a>
      <a href="#education">Образование</a>
      <a href="#reviews">Отзывы</a>
      <a href="#contact">Контакты</a>
    </nav>
    <button class="burger" id="burger"><span></span><span></span><span></span></button>
  </div>
  <div class="mobile-nav" id="mobileNav">
    <a href="#products">Каталог</a>
    <a href="#free">Бесплатные</a>
    <a href="#about">Обо мне</a>
    <a href="#education">Образование</a>
    <a href="#reviews">Отзывы</a>
    <a href="#contact">Контакты</a>
  </div>
</header>

<section class="hero">
  </section>

<section class="about" id="about">
  </section>

<section class="products" id="products">
  <div class="container">
    <div class="section-header">
      <h2 class="section-title">Каталог <span>материалов</span></h2>
    </div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">Все</button>
      <button class="filter-btn" data-filter="free">Бесплатные</button>
      <button class="filter-btn" data-filter="5">5 класс</button>
      <button class="filter-btn" data-filter="6">6 класс</button>
      <button class="filter-btn" data-filter="7">7 класс</button>
      <button class="filter-btn" data-filter="8">8 класс</button>
      <button class="filter-btn" data-filter="9">9 класс</button>
      <button class="filter-btn" data-filter="10">10 класс</button>
      <button class="filter-btn" data-filter="11">11 класс</button>
      <button class="filter-btn" data-filter="oge">ОГЭ</button>
      <button class="filter-btn" data-filter="ege">ЕГЭ</button>
    </div>
    <div class="products-grid" id="productsGrid"></div>
  </div>
</section>

<section class="education" id="education">
  </section>

<section class="reviews" id="reviews">
  </section>

<section class="contact" id="contact">
  </section>

<footer class="footer">
  </footer>

<script src="script.js?v=fixed-structure"></script>
</body>
</html>
